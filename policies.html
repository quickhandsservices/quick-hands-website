

<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Policies | Quick Hands Services & Marketplace</title>

  <meta name="description" content="Read the policies of Quick Hands Services & Marketplace.">

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f7f7f7;

      color: #222;

      line-height: 1.7;

    }

    header {

      background: #171717;

      color: white;

      padding: 22px 16px;

      text-align: center;

    }

    header a { color: white; text-decoration: none; }

    main {

      max-width: 850px;

      margin: 25px auto;

      padding: 0 16px;

    }

    .policy {

      background: white;

      padding: 22px;

      margin-bottom: 18px;

      border-radius: 12px;

      box-shadow: 0 2px 8px #0000000d;

    }

    .policy h2 { color: #a95710; }

    .policy-content { white-space: pre-wrap; overflow-wrap: anywhere; }

    #message {

      background: white;

      padding: 20px;

      border-radius: 10px;

    }

    footer { text-align: center; padding: 25px; }

  </style>

</head>

<body>

  <header>

    <h1>Quick Hands Services & Marketplace</h1>

    <p>Policies and customer information</p>

    <a href="index.html">← Back to Home</a>

  </header>

  <main>

    <h2>Our Policies</h2>

    <p>Please read the applicable policy before placing an order or requesting a service.</p>

    <div id="message" role="status">Loading published policies…</div>

    <div id="policies"></div>

  </main>

  <footer>

    © 2026 Quick Hands Services & Marketplace

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =

      "https://gccphxlofazghlgtzwba.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_DPI3mrF-ZpajMMD480pHew_tNM3-IyU";

    const db = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    async function loadPolicies() {

      const message = document.getElementById("message");

      const container = document.getElementById("policies");

      try {

        const { data, error } = await db

          .from("site_policies")

          .select("policy_key, title, content, updated_at")

          .eq("status", "published")

          .order("id", { ascending: true });

        if (error) throw error;

        message.textContent = data.length

          ? ""

          : "Our policies are being prepared. Please check again later.";

        data.forEach(function(policy) {

          const article = document.createElement("article");

          article.className = "policy";

          const heading = document.createElement("h2");

          heading.textContent = policy.title;

          const content = document.createElement("div");

          content.className = "policy-content";

          content.textContent = policy.content;

          article.appendChild(heading);

          article.appendChild(content);

          container.appendChild(article);

        });

      } catch (error) {

        console.error("Policy loading error:", error);

        message.textContent =

          "We could not load the policies right now. Please try again later.";

      }

    }

    loadPolicies();

  </script>

</body>

</html>
