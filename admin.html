<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Hands Admin Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
        }

        .top {
            background: linear-gradient(90deg, #f5a400, #e67e22, #d35400);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .top h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .top p {
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e67e22;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d35400;
        }

        .logout {
            background: #333;
            margin-top: 20px;
        }

        .back {
            background: #555;
            margin-bottom: 15px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error {
            background: #ffe5e5;
            color: #a40000;
        }

        .success {
            background: #e5f8e9;
            color: #176b2c;
        }

        .hidden {
            display: none !important;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 20px;
        }

        .admin-item {
            background: #f7f7f7;
            padding: 22px 15px;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .admin-item:hover {
            border-color: #e67e22;
            background: #fff7ed;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .status-box {
            background: #fff7ed;
            border: 1px solid #f5a400;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .market-list {
            margin-top: 20px;
        }

        .market {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .market strong {
            display: block;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

<div class="top">
    <h1>QUICK HANDS</h1>
    <p>Services & Marketplace — Admin Dashboard</p>
</div>

<div class="container">

    <!-- LOGIN -->
    <div id="login-section" class="card">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Sign in to manage Quick Hands Services & Marketplace.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button type="button" onclick="login()">
            Sign In
        </button>

        <div id="login-message" class="message"></div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard-section" class="hidden">

        <div class="card">

            <h2>Welcome to Quick Hands Admin 👋</h2>

            <p id="admin-email" class="subtitle"></p>

            <div class="admin-grid">

                <div class="admin-item" onclick="openMarkets()">🏪<br>Markets</div>
                </div>

                <div class="admin-item" onclick="openSection('Shops & Sellers')">
                    🏬<br>
                    Shops & Sellers
                </div>

                <div class="admin-item" onclick="openSection('Products')">
                    📦<br>
                    Products
                </div>

                <div class="admin-item" onclick="openSection('Orders')">
                    🛒<br>
                    Orders
                </div>

                <div class="admin-item" onclick="openSection('Customers')">
                    👥<br>
                    Customers
                </div>

                <div class="admin-item" onclick="openSection('Payments')">
                    💳<br>
                    Payments
                </div>

                <div class="admin-item" onclick="openSection('Delivery')">
                    🚚<br>
                    Delivery
                </div>

                <div class="admin-item" onclick="openSection('Commissions & Payouts')">
                    💰<br>
                    Commissions & Payouts
                </div>

            </div>

            <button
                type="button"
                class="logout"
                onclick="logout()">
                Sign Out
            </button>

        </div>

    </div>


    <!-- MANAGEMENT SECTION -->
    <div id="management-section" class="hidden">

        <div class="card">

            <button
                type="button"
                class="back"
                onclick="backToDashboard()">
                ← Back to Dashboard
            </button>

            <h2 id="section-title" class="section-title">
                Management
            </h2>

            <p id="section-description" class="subtitle"></p>

            <div id="section-content"></div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://gccphxlofazghlgtzwba.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DPI3mrF-ZpajMMD480pHew_tNM3-IyU";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


function showMessage(message, type) {

    const box =
        document.getElementById("login-message");

    box.textContent = message;

    box.className =
        "message " + type;

    box.style.display = "block";
}


async function login() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }

    showMessage(
        "Signing in...",
        "success"
    );

    try {

        const result =
            await supabaseClient.auth
            .signInWithPassword({
                email: email,
                password: password
            });

        if (result.error) {

            showMessage(
                result.error.message,
                "error"
            );

            return;
        }

        const adminResult =
            await supabaseClient.rpc("is_admin");

        if (adminResult.error) {

            await supabaseClient.auth.signOut();

            showMessage(
                "Admin verification failed.",
                "error"
            );

            return;
        }

        if (adminResult.data !== true) {

            await supabaseClient.auth.signOut();

            showMessage(
                "This account is not authorized as a Quick Hands Admin.",
                "error"
            );

            return;
        }

        showDashboard(
            result.data.user.email
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "Something went wrong while signing in.",
            "error"
        );
    }
}


function showDashboard(email) {

    document
        .getElementById("login-section")
        .classList.add("hidden");

    document
        .getElementById("management-section")
        .classList.add("hidden");

    document
        .getElementById("dashboard-section")
        .classList.remove("hidden");

    document
        .getElementById("admin-email")
        .textContent =
        "Signed in as: " + email;
}

function openMarkets() {
    document.getElementById("dashboard-section").classList.add("hidden");
    document.getElementById("management-section").classList.remove("hidden");

    document.getElementById("section-title").textContent = "Markets";
    document.getElementById("section-description").textContent =
        "Manage Quick Hands markets.";

    document.getElementById("section-content").innerHTML = `
        <div class="status-box">
            <strong>🏪 Markets Management</strong>
            <p style="margin-top:8px;">
                Loading markets...
            </p>
        </div>

        <div id="market-list" class="market-list">
            Loading...
        </div>
    `;

    loadMarkets();
}
function openSection(sectionName) {

    document
        .getElementById("dashboard-section")
        .classList.add("hidden");

    document
        .getElementById("management-section")
        .classList.remove("hidden");

    document
        .getElementById("section-title")
        .textContent =
        sectionName;

    document
        .getElementById("section-description")
        .textContent =
        "Quick Hands Admin — " +
        sectionName +
        " management.";

    const content =
        document.getElementById("section-content");

    if (sectionName === "Markets") {

        content.innerHTML = `
            <div class="status-box">
                <strong>🏪 Markets Management</strong>
                <p style="margin-top:8px;">
                    This section is ready to connect to the
                    Supabase Markets table.
                </p>
            </div>

            <div id="market-list" class="market-list">
                Loading markets...
            </div>
        `;

        loadMarkets();

        return;
    }


    content.innerHTML = `
        <div class="status-box">
            <strong>${sectionName}</strong>

            <p style="margin-top:8px;">
                The ${sectionName} section is working.
                We will connect it to Supabase next.
            </p>
        </div>
    `;
}


async function loadMarkets() {

    const list =
        document.getElementById("market-list");

    if (!list) {
        return;
    }

    const result =
        await supabaseClient
        .from("Market")
        .select("id, Name, description")
        .order("id", { ascending: true });

    if (result.error) {

        list.innerHTML = `
            <div class="status-box">
                Unable to load markets.
                <br><br>
                ${result.error.message}
            </div>
        `;

        console.error(result.error);

        return;
    }

    if (!result.data || result.data.length === 0) {

        list.innerHTML = `
            <div class="status-box">
                No markets found.
            </div>
        `;

        return;
    }

    list.innerHTML = "";

    result.data.forEach(function(market) {

        const item =
            document.createElement("div");

        item.className = "market";

        item.innerHTML = `
            <strong>${escapeHtml(
                market.Name || "Unnamed Market"
            )}</strong>

            <span>
                ${escapeHtml(
                    market.description || ""
                )}
            </span>
        `;

        list.appendChild(item);

    });
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function backToDashboard() {

    document
        .getElementById("management-section")
        .classList.add("hidden");

    document
        .getElementById("dashboard-section")
        .classList.remove("hidden");
}


async function logout() {

    await supabaseClient.auth.signOut();

    document
        .getElementById("dashboard-section")
        .classList.add("hidden");

    document
        .getElementById("management-section")
        .classList.add("hidden");

    document
        .getElementById("login-section")
        .classList.remove("hidden");

    document
        .getElementById("email")
        .value = "";

    document
        .getElementById("password")
        .value = "";

    showMessage(
        "You have been signed out.",
        "success"
    );
}


async function checkExistingSession() {

    try {

        const result =
            await supabaseClient.auth.getSession();

        if (!result.data.session) {
            return;
        }

        const adminResult =
            await supabaseClient.rpc("is_admin");

        if (adminResult.data === true) {

            showDashboard(
                result.data.session.user.email
            );

        }

    } catch (error) {

        console.error(error);
    }
}


checkExistingSession();

</script>

</body>
</html>
