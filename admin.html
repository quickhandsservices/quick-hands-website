<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quick Hands Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.top {
    background: linear-gradient(90deg, #f5a400, #e67e22, #d35400);
    color: white;
    text-align: center;
    padding: 20px;
}

.top h1 {
    margin: 0 0 5px;
    font-size: 25px;
}

.top p {
    margin: 0;
    font-size: 14px;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 0 16px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

.subtitle {
    color: #666;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #e67e22;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.admin-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 20px;
}

.admin-button {
    background: #f7f7f7;
    color: #222;
    padding: 22px 15px;
    border-radius: 12px;
    border: 2px solid transparent;
}

.admin-button:hover {
    border-color: #e67e22;
    background: #fff7ed;
}

.logout {
    background: #333;
    margin-top: 20px;
}

.back {
    background: #555;
    margin-bottom: 18px;
}

.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

.error {
    background: #ffe5e5;
    color: #a40000;
}

.success {
    background: #e5f8e9;
    color: #176b2c;
}

.status-box {
    background: #fff7ed;
    border: 1px solid #f5a400;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

.market {
    background: #f7f7f7;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid #eee;
}

.market strong {
    display: block;
    margin-bottom: 6px;
    font-size: 17px;
}

.market-description {
    color: #666;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #666;
}

@media (max-width: 600px) {

    .admin-grid {
        grid-template-columns: 1fr;
    }

    .container {
        margin-top: 15px;
    }
}
</style>
</head>

<body>

<div class="top">

    <h1>QUICK HANDS</h1>

    <p>
        Services &amp; Marketplace — Admin Dashboard
    </p>

</div>


<div class="container">


<!-- LOGIN -->

<div id="login-section" class="card">

    <h2>Admin Login</h2>

    <p class="subtitle">
        Sign in to manage Quick Hands Services &amp; Marketplace.
    </p>

    <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button type="button" onclick="login()">
        Sign In
    </button>

    <div id="login-message" class="message"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard-section" class="hidden">

    <div class="card">

        <h2>
            Welcome to Quick Hands Admin 👋
        </h2>

        <p id="admin-email" class="subtitle"></p>


        <div class="admin-grid">

            <button
                type="button"
                class="admin-button"
                onclick="openMarkets()"
            >
                🏪<br>
                Markets
            </button>


            <button
                type="button"
                class="admin-button"
                onclick="openSection('Shops & Sellers')"
            >
                🏬<br>
                Shops &amp; Sellers
            </button>


            <button
                type="button"
                class="admin-button"
                onclick="openSection('Products')"
            >
                📦<br>
                Products
            </button>


            <button
                type="button"
                class="admin-button"
                onclick="openSection('Orders')"
            >
                🛒<br>
                Orders
            </button>


            <button
                type="button"
                class="admin-button"
                onclick="openSection('Customers')"
            >
                👥<br>
                Customers
            </button>


            <button
                type="button"
                class="admin-button"
                onclick="openSection('Payments')"
            >
                💳<br>
                Payments
            </button>


            <button
                type="button"
                class="admin-button"
                onclick="openSection('Delivery')"
            >
                🚚<br>
                Delivery
            </button>


            <button
                type="button"
                class="admin-button"
                onclick="openSection('Commissions & Payouts')"
            >
                💰<br>
                Commissions &amp; Payouts
            </button>

        </div>


        <button
            type="button"
            class="logout"
            onclick="logout()"
        >
            Sign Out
        </button>

    </div>

</div>


<!-- MANAGEMENT -->

<div id="management-section" class="hidden">

    <div class="card">

        <button
            type="button"
            class="back"
            onclick="backToDashboard()"
        >
            ← Back to Dashboard
        </button>


        <h2 id="section-title">
            Management
        </h2>


        <p
            id="section-description"
            class="subtitle"
        ></p>


        <div id="section-content"></div>

    </div>

</div>


</div>


<script>

const SUPABASE_URL =
    "https://gccphxlofazghlgtzwba.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DPI3mrF-ZpajMMD480pHew_tNM3-IyU";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const loginSection =
    document.getElementById("login-section");

const dashboardSection =
    document.getElementById("dashboard-section");

const managementSection =
    document.getElementById("management-section");

const sectionTitle =
    document.getElementById("section-title");

const sectionDescription =
    document.getElementById("section-description");

const sectionContent =
    document.getElementById("section-content");


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function showMessage(message, type) {

    const box =
        document.getElementById("login-message");

    box.textContent = message;

    box.className =
        "message " + type;

    box.style.display = "block";

}


async function login() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    showMessage(
        "Signing in...",
        "success"
    );


    try {

        const result =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        const data = result.data;
        const error = result.error;


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            return;
        }


        const adminResult =
            await supabaseClient.rpc("is_admin");


        const isAdmin =
            adminResult.data;

        const adminError =
            adminResult.error;


        if (
            adminError ||
            isAdmin !== true
        ) {

            await supabaseClient.auth.signOut();

            showMessage(
                "This account is not authorized as a Quick Hands Admin.",
                "error"
            );

            return;
        }


        showDashboard(
            data.user.email
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Something went wrong while signing in.",
            "error"
        );

    }

}


function showDashboard(email) {

    loginSection.classList.add("hidden");

    managementSection.classList.add("hidden");

    dashboardSection.classList.remove("hidden");


    document.getElementById(
        "admin-email"
    ).textContent =
        "Signed in as: " + email;

}


function openMarkets() {

    dashboardSection.classList.add("hidden");

    managementSection.classList.remove("hidden");


    sectionTitle.textContent =
        "Markets";


    sectionDescription.textContent =
        "Manage Quick Hands markets.";


    sectionContent.innerHTML =

        '<div class="status-box">' +

        '<strong>🏪 Markets Management</strong>' +

        '<p style="margin-top:8px">' +

        'Your Abuja markets are listed below.' +

        '</p>' +

        '</div>' +

        '<div id="market-list">' +

        '<div class="loading">' +

        'Loading markets...' +

        '</div>' +

        '</div>';


    loadMarkets();

}


function openSection(name) {

    dashboardSection.classList.add("hidden");

    managementSection.classList.remove("hidden");


    sectionTitle.textContent =
        name;


    sectionDescription.textContent =
        "Quick Hands Admin — " +
        name +
        " management.";


    sectionContent.innerHTML =

        '<div class="status-box">' +

        '<strong>' +
        escapeHtml(name) +
        '</strong>' +

        '<p style="margin-top:8px">' +

        'This section is ready for connection to Supabase.' +

        '</p>' +

        '<p style="margin-top:8px">' +

        'We can build this section next without changing the working login.' +

        '</p>' +

        '</div>';

}


async function loadMarkets() {

    const list =
        document.getElementById("market-list");


    try {

        const result =
            await supabaseClient
                .from("Market")
                .select(
                    "id, Name, description"
                )
                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


        const data =
            result.data;

        const error =
            result.error;


        if (error) {

            list.innerHTML =

                '<div class="status-box">' +

                '<strong>Unable to load markets</strong>' +

                '<p style="margin-top:8px">' +

                escapeHtml(error.message) +

                '</p>' +

                '</div>';


            console.error(error);

            return;
        }


        if (
            !data ||
            data.length === 0
        ) {

            list.innerHTML =

                '<div class="status-box">' +

                'No markets found.' +

                '</div>';

            return;
        }


        list.innerHTML = "";


        data.forEach(function(market) {

            const item =
                document.createElement("div");


            item.className =
                "market";


            item.innerHTML =

                "<strong>" +

                escapeHtml(
                    market.Name ||
                    "Unnamed Market"
                ) +

                "</strong>" +

                '<div class="market-description">' +

                escapeHtml(
                    market.description ||
                    "No description available."
                ) +

                "</div>";


            list.appendChild(item);

        });


    } catch (error) {

        console.error(error);


        list.innerHTML =

            '<div class="status-box">' +

            'Unable to load markets.' +

            '</div>';

    }

}


function backToDashboard() {

    managementSection.classList.add("hidden");

    dashboardSection.classList.remove("hidden");

}


async function logout() {

    await supabaseClient.auth.signOut();


    dashboardSection.classList.add("hidden");

    managementSection.classList.add("hidden");

    loginSection.classList.remove("hidden");


    document.getElementById(
        "email"
    ).value = "";


    document.getElementById(
        "password"
    ).value = "";


    showMessage(
        "You have been signed out.",
        "success"
    );

}


async function checkExistingSession() {

    try {

        const result =
            await supabaseClient.auth.getSession();


        const data =
            result.data;


        if (!data.session) {

            return;
        }


        const adminResult =
            await supabaseClient.rpc(
                "is_admin"
            );


        const isAdmin =
            adminResult.data;


        if (isAdmin === true) {

            showDashboard(
                data.session.user.email
            );

        }


    } catch (error) {

        console.error(error);

    }

}


checkExistingSession();

</script>

</body>
</html>
